# ==============================
# Wholesale App - Configuration
# ==============================

# Server port — Railway sets PORT env var automatically
server.port=${PORT:8080}

# ==============================
# H2 Database (File Mode)
# Data is stored in ./data/wholesale.mv.db
# On Railway, ./data/ persists within each deploy but resets on redeploy
# For persistent data across deploys, switch to Railway's MySQL/PostgreSQL add-on
# ==============================
spring.datasource.url=jdbc:h2:file:./data/wholesale;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sourav
spring.datasource.password=1234

# JPA / Hibernate - auto-creates tables on startup
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (debug at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload limits (for Excel import)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==============================
# Google Sheets Integration
# ==============================
# Configure ONE of these:
#
# Option A: Set env var GOOGLE_SHEETS_CREDENTIALS_JSON with the full service account JSON string
# Option B: Set env var GOOGLE_SHEETS_CREDENTIALS_PATH pointing to the downloaded JSON file
# Option C: Uncomment below and paste your service account JSON directly (not recommended for GitHub)
#
# google.sheets.credentials.json=Paste your full service account JSON here
# google.sheets.credentials.path=/path/to/service-account.json
#
# Spreadsheet ID (from the URL: https://docs.google.com/spreadsheets/d/THIS_PART/edit)
# This is hardcoded in GoogleSheetsService.java
#
# IMPORTANT: Google Sheets sync is OPTIONAL. The app works fully with just H2.
