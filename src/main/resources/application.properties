# ==============================
# Wholesale App - Configuration
# ==============================

server.port=8080

# ==============================
# H2 Database (File Mode)
# Data is stored in ./data/wholesale.mv.db
# ==============================
spring.datasource.url=jdbc:h2:file:./data/wholesale;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate - auto-creates tables on startup
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (debug at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload limits (for Excel import)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
