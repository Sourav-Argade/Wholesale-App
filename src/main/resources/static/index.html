<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wholesale App</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
    <!-- ====== Login Screen ====== -->
    <div id="loginScreen" class="screen active">
        <div class="login-container">
            <div class="login-logo">📦</div>
            <h1>Wholesale App</h1>
            <p class="login-subtitle">Route &amp; Customer Manager</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
                </div>
                <div id="loginError" class="error-msg hide"></div>
                <button type="submit" class="btn btn-primary btn-full">Sign In</button>
            </form>
        </div>
    </div>

    <!-- ====== Main App Screen ====== -->
    <div id="appScreen" class="screen">
        <!-- Top Navigation Bar -->
        <header class="app-header">
            <button id="menuToggle" class="icon-btn" aria-label="Menu">☰</button>
            <h2 id="pageTitle">Dashboard</h2>
            <button id="logoutBtn" class="icon-btn" aria-label="Logout">🚪</button>
        </header>

        <!-- Side Navigation -->
        <nav id="sideNav" class="side-nav">
            <div class="side-nav-header">
                <span class="side-nav-user" id="navUserName">User</span>
                <span class="side-nav-role" id="navUserRole">Role</span>
            </div>
            <ul class="side-nav-menu">
                <li><a href="#" data-page="dashboard" class="nav-active">📊 Dashboard</a></li>
                <li><a href="#" data-page="customers">👥 Customers</a></li>
                <li><a href="#" data-page="products">📦 Products</a></li>
                <li><a href="#" data-page="routes">🛣️ Routes</a></li>
                <li><a href="#" data-page="mapview">🗺️ Map View</a></li>
                <li><a href="#" data-page="visits">✅ Check-in</a></li>
                <li><a href="#" data-page="prices">💰 Price History</a></li>
                <li><a href="#" data-page="excel">📋 Backup / Excel</a></li>
            </ul>
        </nav>

        <!-- Overlay for side nav -->
        <div id="navOverlay" class="overlay hide"></div>

        <!-- Main Content Area -->
        <main id="mainContent" class="main-content">
            <!-- Content loaded dynamically -->
        </main>
    </div>

    <!-- ====== Modal ====== -->
    <div id="modalOverlay" class="modal-overlay hide">
        <div class="modal" id="modalContent">
            <div class="modal-header">
                <h3 id="modalTitle">Modal</h3>
                <button id="modalClose" class="icon-btn">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
